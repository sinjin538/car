<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 운행일보</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f6f9; color: #333; letter-spacing: -0.3px; }
        
        #mobile-view { padding-bottom: 80px; }
        .header { background: #007bff; color: #fff; padding: 15px 20px; text-align: center; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 1.1rem; font-weight: 700; color: #007bff; margin-bottom: 15px; border-bottom: 2px solid #e8f0fe; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; color: #555; margin-bottom: 5px; }
        .form-input, .form-select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 1rem; font-family: inherit; }
        .form-input[readonly] { background-color: #e9ecef; font-weight: bold; color: #0056b3; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .calc-result { background: #e8f0fe; padding: 12px; border-radius: 6px; text-align: center; margin-top: 10px; border: 1px dashed #007bff; font-weight: bold;}
        .signature-area { border: 2px solid #ccc; border-radius: 8px; background: #fafbfc; position: relative; margin-top: 10px; }
        canvas { width: 100%; height: 200px; display: block; touch-action: none; }
        .clear-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .submit-btn { flex: 1; padding: 16px; background: #28a745; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .print-btn { flex: 1; padding: 16px; background: #6c757d; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

        #print-view { display: none; }
        
        @media print {
            @page { size: A4 portrait; margin: 0; }
            html, body { margin: 0; padding: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; width: 100%; height: 100%; }
            #mobile-view { display: none !important; }
            #print-view { display: block !important; position: relative; width: 210mm; height: 297mm; overflow: hidden; page-break-after: avoid; }
            #print-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; object-fit: fill; }
            
            .print-data { position: absolute; font-size: 16px; font-weight: bold; color: #000; z-index: 10; font-family: 'Malgun Gothic', sans-serif; white-space: nowrap; }
            .print-sign { position: absolute; z-index: 10; width: 80px; height: 40px; }

            /* 1. 공공일보.png 좌표 */
            .type-general #pt-year { top: 30%; left: 24%; }
            .type-general #pt-month { top: 30%; left: 35%; }
            .type-general #pt-day { top: 30%; left: 45%; }
            .type-general #pt-car { top: 38.5%; left: 42%; }
            .type-general #pt-driver { top: 38.5%; left: 68%; }
            .type-general #pt-time-start { top: 46%; left: 28%; }
            .type-general #pt-time-end { top: 49%; left: 28%; }
            .type-general #pt-km-start { top: 46%; left: 65%; }
            .type-general #pt-km-end { top: 49%; left: 65%; }
            .type-general #pt-km-total { top: 52%; left: 65%; font-size: 18px; color: #0056b3; }
            .type-general #pt-loc-start { top: 61%; left: 25%; }
            .type-general #pt-loc-end { top: 64%; left: 25%; }
            .type-general #pt-pax-w { top: 73%; left: 25%; }
            .type-general #pt-pax-n { top: 73%; left: 38%; }
            .type-general #pt-cust-name { top: 73%; left: 70%; }
            .type-general #pt-sign { top: 71.5%; left: 82%; }

            /* 2. 시티일보.png 좌표 */
            .type-citytour #pt-year { display: none; }
            .type-citytour #pt-month { display: none; }
            .type-citytour #pt-day { top: 33%; left: 30%; font-size: 14px; } 
            .type-citytour #pt-car { display: none; }
            .type-citytour #pt-driver { top: 50.5%; left: 25%; }
            .type-citytour #pt-time-start { top: 53.5%; left: 25%; }
            .type-citytour #pt-time-end { top: 53.5%; left: 55%; }
            .type-citytour #pt-km-start { top: 56.5%; left: 25%; }
            .type-citytour #pt-km-end { top: 56.5%; left: 55%; }
            .type-citytour #pt-km-total { top: 56.5%; left: 85%; font-size: 18px; color: #0056b3; }
            .type-citytour #pt-loc-start { top: 38.5%; left: 25%; }
            .type-citytour #pt-loc-end { top: 41.5%; left: 25%; }
            .type-citytour #pt-pax-w { top: 44.5%; left: 25%; }
            .type-citytour #pt-pax-n { top: 44.5%; left: 45%; }
            .type-citytour #pt-cust-name { top: 75%; left: 70%; }
            .type-citytour #pt-sign { top: 73%; left: 83%; width: 70px; height: 35px; }
        }
    </style>
</head>
<body>

    <div id="mobile-view">
        <header class="header">
            <button class="back-btn" onclick="goBack()">❮</button>
            운행일보 작성
            <div style="width: 24px;"></div>
        </header>

        <div class="container">
            <div class="card" style="background: #fff3cd; border: 1px solid #ffe69c; display: none;" id="dev-box">
                <div class="form-label">⚙️ 양식 종류 선택 (테스트용)</div>
                <select id="m-type" class="form-select" onchange="toggleType()">
                    <option value="general">일반/공공 운행 (공공일보.png)</option>
                    <option value="citytour">서울시티투어 (시티일보.png)</option>
                </select>
            </div>

            <div class="card">
                <div class="card-title">1. 운행 정보 (자동입력)</div>
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">운행일자</label><input type="date" id="m-date" class="form-input" readonly></div>
                    <div class="form-group"><label class="form-label">차량번호</label><input type="text" id="m-car" class="form-input" readonly></div>
                    <div class="form-group" style="grid-column: span 2;"><label class="form-label">운전원</label><input type="text" id="m-driver" class="form-input" readonly></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">2. 운행 기록 및 거리</div>
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">출발시간</label><input type="time" id="m-time-start" class="form-input"></div>
                    <div class="form-group"><label class="form-label">도착시간</label><input type="time" id="m-time-end" class="form-input"></div>
                    <div class="form-group"><label class="form-label">출발 누계(km)</label><input type="number" id="m-km-start" class="form-input" oninput="calcKm()"></div>
                    <div class="form-group"><label class="form-label">도착 누계(km)</label><input type="number" id="m-km-end" class="form-input" oninput="calcKm()"></div>
                </div>
                <div class="calc-result">총 운행 거리: <span id="m-km-total">0</span> km</div>
            </div>

            <div class="card">
                <div class="card-title">3. 탑승객 정보</div>
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">출발지</label><input type="text" id="m-loc-start" class="form-input"></div>
                    <div class="form-group"><label class="form-label">목적지</label><input type="text" id="m-loc-end" class="form-input"></div>
                    <div class="form-group"><label class="form-label">휠체어 (명)</label><input type="number" id="m-pax-w" class="form-input"></div>
                    <div class="form-group"><label class="form-label">일반 (명)</label><input type="number" id="m-pax-n" class="form-input"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">4. 고객 서명</div>
                <div class="form-group"><label class="form-label">고객 성함</label><input type="text" id="m-cust-name" class="form-input" placeholder="이름"></div>
                <div class="signature-area">
                    <button class="clear-btn" onclick="clearSign()">지우기</button>
                    <canvas id="sign-pad"></canvas>
                </div>
            </div>

            <div class="btn-group">
                <button class="submit-btn" onclick="alert('서버 전송 개발 예정입니다!')">전송하기</button>
                <button class="print-btn" onclick="doPrint()">🖨️ 인쇄 (미리보기)</button>
            </div>
        </div>
    </div>

    <div id="print-view" class="type-general">
        <img id="print-bg" src="공공일보.png" alt="배경양식">
        <div class="print-data" id="pt-year"></div>
        <div class="print-data" id="pt-month"></div>
        <div class="print-data" id="pt-day"></div>
        <div class="print-data" id="pt-car"></div>
        <div class="print-data" id="pt-driver"></div>
        <div class="print-data" id="pt-time-start"></div>
        <div class="print-data" id="pt-time-end"></div>
        <div class="print-data" id="pt-km-start"></div>
        <div class="print-data" id="pt-km-end"></div>
        <div class="print-data" id="pt-km-total"></div>
        <div class="print-data" id="pt-loc-start"></div>
        <div class="print-data" id="pt-loc-end"></div>
        <div class="print-data" id="pt-pax-w"></div>
        <div class="print-data" id="pt-pax-n"></div>
        <div class="print-data" id="pt-cust-name"></div>
        <img class="print-sign" id="pt-sign" style="display:none;">
    </div>

    <script>
        // 🔥 모듈 2에서 보따리 받아오기 마법
        window.onload = () => {
            resizeCanvas();
            const params = new URLSearchParams(window.location.search);
            
            if(params.has('date')) {
                // 파라미터가 있으면 자동 세팅
                document.getElementById('m-type').value = params.get('type') || 'general';
                document.getElementById('m-date').value = params.get('date');
                document.getElementById('m-car').value = params.get('car') || '';
                document.getElementById('m-driver').value = params.get('driver') || '';
            } else {
                // 단독 실행 시 오늘 날짜
                document.getElementById('m-date').valueAsDate = new Date();
                document.getElementById('dev-box').style.display = 'block'; // 테스트 박스 보이기
            }
            toggleType();
        };

        function goBack() {
            window.location.href = 'driver.html'; // 모듈 2로 귀환
        }

        function toggleType() {
            const type = document.getElementById('m-type').value;
            const printView = document.getElementById('print-view');
            const printBg = document.getElementById('print-bg');

            if (type === 'general') {
                printView.className = 'type-general';
                printBg.src = '공공일보.png'; 
            } else {
                printView.className = 'type-citytour';
                printBg.src = '시티일보.png'; 
            }
        }

        function calcKm() {
            let s = parseFloat(document.getElementById('m-km-start').value) || 0;
            let e = parseFloat(document.getElementById('m-km-end').value) || 0;
            document.getElementById('m-km-total').innerText = Math.max(0, e - s);
        }

        // 캔버스 (사인패드)
        const canvas = document.getElementById('sign-pad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        
        function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = 200; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#000'; }
        
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top };
        }
        
        canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); });
        canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); });
        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseout', () => { isDrawing = false; });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); }, {passive:false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if(!isDrawing) return; ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); }, {passive:false});
        canvas.addEventListener('touchend', () => { isDrawing = false; });

        function clearSign() { ctx.clearRect(0,0, canvas.width, canvas.height); }

        function doPrint() {
            const type = document.getElementById('m-type').value;

            // 날짜 세팅
            const dStr = document.getElementById('m-date').value;
            if(dStr) {
                const d = new Date(dStr);
                if (type === 'general') {
                    document.getElementById('pt-year').innerText = d.getFullYear();
                    document.getElementById('pt-month').innerText = String(d.getMonth()+1).padStart(2,'0');
                    document.getElementById('pt-day').innerText = String(d.getDate()).padStart(2,'0');
                } else {
                    document.getElementById('pt-day').innerText = `${d.getFullYear()}년 ${String(d.getMonth()+1).padStart(2,'0')}월 ${String(d.getDate()).padStart(2,'0')}일`;
                }
            }

            // 입력값 옮겨 적기
            document.getElementById('pt-car').innerText = document.getElementById('m-car').value || '';
            document.getElementById('pt-driver').innerText = document.getElementById('m-driver').value || '';
            document.getElementById('pt-time-start').innerText = document.getElementById('m-time-start').value || '';
            document.getElementById('pt-time-end').innerText = document.getElementById('m-time-end').value || '';
            document.getElementById('pt-km-start').innerText = document.getElementById('m-km-start').value || '';
            document.getElementById('pt-km-end').innerText = document.getElementById('m-km-end').value || '';
            document.getElementById('pt-km-total').innerText = document.getElementById('m-km-total').innerText || '';
            document.getElementById('pt-loc-start').innerText = document.getElementById('m-loc-start').value || '';
            document.getElementById('pt-loc-end').innerText = document.getElementById('m-loc-end').value || '';
            document.getElementById('pt-pax-w').innerText = document.getElementById('m-pax-w').value || '';
            document.getElementById('pt-pax-n').innerText = document.getElementById('m-pax-n').value || '';
            document.getElementById('pt-cust-name').innerText = document.getElementById('m-cust-name').value || '';

            // 사인 0.5초 딜레이
            const signImg = document.getElementById('pt-sign');
            const dataUrl = canvas.toDataURL('image/png');
            if(dataUrl.length > 2000) { 
                signImg.src = dataUrl; signImg.style.display = 'block';
            } else { signImg.style.display = 'none'; }

            setTimeout(() => { window.print(); }, 500);
        }
    </script>
</body>
</html>
