    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f6f9; color: #333; letter-spacing: -0.3px; }
        #mobile-view { padding-bottom: 80px; }
        .header { background: #007bff; color: #fff; padding: 15px 20px; text-align: center; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 1.1rem; font-weight: 700; color: #007bff; margin-bottom: 15px; border-bottom: 2px solid #e8f0fe; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; color: #555; margin-bottom: 5px; }
        .form-input, .form-select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 1rem; font-family: inherit; }
        .form-input[readonly] { background-color: #e9ecef; font-weight: bold; color: #0056b3; border: none;}
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .calc-result { background: #e8f0fe; padding: 12px; border-radius: 6px; text-align: center; margin-top: 10px; border: 1px dashed #007bff; font-weight: bold;}
        .signature-area { border: 2px solid #ccc; border-radius: 8px; background: #fafbfc; position: relative; margin-top: 10px; }
        canvas { width: 100%; height: 120px; display: block; touch-action: none; background: transparent; }
        .clear-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; z-index: 5; }
        
        .radio-group { display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 0; }
        .radio-group label { font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .radio-group input[type="radio"] { transform: scale(1.2); }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .save-btn { flex: 1; padding: 16px; background: #ffc107; color: #000; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .print-btn { flex: 1; padding: 16px; background: #28a745; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .reset-btn { width: 100%; margin-top: 10px; padding: 12px; background: #dc3545; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }

        #print-view { display: none; }
        @media print {
            @page { size: A4 portrait; margin: 0; }
            html, body { margin: 0; padding: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; width: 100%; height: 100%; }
            #mobile-view { display: none !important; }
            #print-view { display: block !important; position: relative; width: 210mm; height: 297mm; overflow: hidden; page-break-after: avoid; }
            #print-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; object-fit: fill; }
            .print-data { position: absolute; font-size: 15px; font-weight: 520; color: #000; z-index: 10; font-family: 'Malgun Gothic', sans-serif; white-space: nowrap; }
            
            .print-sign { position: absolute; z-index: 10; width: 100px; height: 50px; }
            .chk-mark { font-size: 16px; color: #d9534f; font-weight: bold; }

            /* ========================================================
               🎯 영점 조절 구역 (대표님 설정 100% 적용 완료!)
               ======================================================== */
            .type-general #pt-year { top: 8.9%; left: 22.8%; font-size:18px;}

            <button class="back-btn" onclick="window.location.href='driver.html'">❮</button>

            <div style="width: 24px;"></div>
        </header>

        <div class="container">
            <!-- 🔥 양식 종류 선택칸 삭제됨 (공공일보 전용 고정) -->

            <div class="card">

                </div>
                <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
                    <label style="font-weight: 600; color: #555;">진행 일차:</label>
                    <input type="number" id="m-trip-day" class="form-input" style="width: 80px; padding: 8px;" placeholder="예: 2"> <span style="font-weight: 600;">일차 숫자만 입력</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📌 운행 사유</div>
                <div class="radio-group">
                    <label><input type="radio" name="m-reason" value="공공예약"> 공공예약</label>
                    <label><input type="radio" name="m-reason" value="이동지원"> 이동지원</label>
                    <label><input type="radio" name="m-reason" value="검사"> 검사</label>
                    <label><input type="radio" name="m-reason" value="수리"> 수리</label>
                    <label><input type="radio" name="m-reason" value="기타"> 기타</label>
                </div>
            </div>

            <div class="card">
                <div class="card-title">1. 운행 정보</div>
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">운행일자</label><input type="date" id="m-date" class="form-input" readonly></div>
                    <div class="form-group">
                        <label class="form-label">차종</label>
                        <select id="m-car-type" class="form-select" readonly style="background-color: #e9ecef; pointer-events: none;">
                            <option value="유니버스">유니버스</option>
                            <option value="쏠라티">쏠라티</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">호차</label><input type="text" id="m-car-name" class="form-input" readonly></div>
                    <div class="form-group"><label class="form-label">차량번호</label><input type="text" id="m-car" class="form-input" readonly></div>
                    
                    <div class="form-group"><label class="form-label">운전원 (정)</label><input type="text" id="m-driver1" class="form-input" readonly></div>
                    <div class="form-group"><label class="form-label">부운전원 (부)</label><input type="text" id="m-driver2" class="form-input" readonly></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">✍️ 운전원 서명</div>
                <label class="form-label">정운전원 서명</label>
                <div class="signature-area">
                    <button class="clear-btn" onclick="clearSign('driver1-sign-pad')">지우기</button>
                    <canvas id="driver1-sign-pad"></canvas>
                </div>
                <div style="margin-top:15px;"></div>
                <label class="form-label">부운전원 서명 (선택)</label>
                <div class="signature-area">
                    <button class="clear-btn" onclick="clearSign('driver2-sign-pad')">지우기</button>
                    <canvas id="driver2-sign-pad"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">2. 운행 기록 및 거리</div>
                <p style="font-size:0.8rem; color:#888; margin-bottom:10px;">※ 숫자만 입력하면 콤마(,)는 알아서 계산됩니다!</p>
                
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">차고지 출발시간</label><input type="time" id="m-time-start" class="form-input"></div>
                    <div class="form-group"><label class="form-label">차고지 도착시간</label><input type="time" id="m-time-end" class="form-input"></div>
                    <div class="form-group"><label class="form-label">출발 누계(km)</label><input type="number" id="m-km-start" class="form-input" oninput="calcKm()"></div>
                    <div class="form-group"><label class="form-label">도착 누계(km)</label><input type="number" id="m-km-end" class="form-input" oninput="calcKm()"></div>
                </div>
                <div class="calc-result" style="margin-bottom: 15px;">차고지 총 운행 거리: <span id="m-km-total">0</span> km</div>

                <div class="grid-2" style="border-top: 2px dashed #eee; padding-top: 15px;">
                    <div class="form-group"><label class="form-label">고객 탑승시간</label><input type="time" id="m-time-board" class="form-input"></div>
                    <div class="form-group"><label class="form-label">고객 하차시간</label><input type="time" id="m-time-alight" class="form-input"></div>
                    <div class="form-group"><label class="form-label">탑승 시 거리(km)</label><input type="number" id="m-km-board" class="form-input" oninput="calcKm()"></div>
                    <div class="form-group"><label class="form-label">하차 시 거리(km)</label><input type="number" id="m-km-alight" class="form-input" oninput="calcKm()"></div>
                </div>
                <div class="calc-result" style="background:#e8f5e9; border-color:#28a745; color:#155724;">고객 탑승 총 거리: <span id="m-km-board-total">0</span> km</div>
            </div>

            <div class="card">
                <div class="card-title">3. 탑승객 정보 및 기타사항</div>
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">출발지</label><input type="text" id="m-loc-start" class="form-input"></div>
                    <div class="form-group"><label class="form-label">목적지</label><input type="text" id="m-loc-end" class="form-input"></div>
                    
                    <div class="form-group"><label class="form-label">휠체어 (명)</label><input type="number" id="m-pax-w" class="form-input"></div>
                    <div class="form-group"><label class="form-label">일반 (명)</label><input type="number" id="m-pax-n" class="form-input"></div>
                    
                    <div class="form-group"><label class="form-label">장애인 (명)</label><input type="number" id="m-pax-disabled" class="form-input"></div>
                    <div class="form-group"><label class="form-label">비장애인 (명)</label><input type="number" id="m-pax-non-disabled" class="form-input"></div>
                </div>
                
                <div class="form-group" style="margin-top: 10px;">
                    <label class="form-label">기타사항 (메모)</label>
                    <input type="text" id="m-note" class="form-input" placeholder="특이사항을 자유롭게 적어주세요">
                </div>
            </div>

            <div class="card">
                <div class="card-title">4. 고객 서명</div>
                <div class="form-group"><label class="form-label">고객 성함</label><input type="text" id="m-cust-name" class="form-input" placeholder="이름"></div>
                <div class="signature-area">
                    <button class="clear-btn" onclick="clearSign('cust-sign-pad')">지우기</button>
                    <canvas id="cust-sign-pad"></canvas>
                </div>
                <p style="font-size:0.8rem; color:#007bff; margin-top:5px; text-align:center;">※ 한 번만 서명하시면 인쇄 시 지정된 2곳에 자동으로 찍힙니다!</p>
            </div>

            <div class="btn-group">
                <button class="save-btn" onclick="saveDraft()">☁️ 클라우드 중간 저장</button>
                <button class="print-btn" onclick="doPrint()">🖨️ 인쇄 (최종 완료)</button>
            </div>
            <button class="reset-btn" onclick="clearDraft()">🗑️ 서버에 저장된 내역 삭제</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD3KPnvBMz14fqe3znaSNxQurJ_mSHG9mY",
            authDomain: "munseo-aaa76.firebaseapp.com",
            projectId: "munseo-aaa76",
            storageBucket: "munseo-aaa76.firebasestorage.app",
            messagingSenderId: "30162440740",
            appId: "1:30162440740:web:02d9a78c31e437bcd77eb1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let globalDocId = ""; 
        const pads = {};

        function initPad(canvasId) {
            const cvs = document.getElementById(canvasId);
            const ctx = cvs.getContext('2d');
            let drawing = false;
            cvs.width = cvs.parentElement.clientWidth || 300; 
            
            cvs.height = 120; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#000'; 
            
            function getPos(e) {
                const rect = cvs.getBoundingClientRect();
                return { x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top };
            }
            cvs.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); });
            cvs.addEventListener('mousemove', (e) => { if (!drawing) return; ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); });
            cvs.addEventListener('mouseup', () => { drawing = false; });
            cvs.addEventListener('mouseout', () => { drawing = false; });
            cvs.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); }, {passive:false});
            cvs.addEventListener('touchmove', (e) => { e.preventDefault(); if(!drawing) return; ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); }, {passive:false});
            cvs.addEventListener('touchend', () => { drawing = false; });
            
            pads[canvasId] = { cvs, ctx };
        }

        function clearSign(id) { pads[id].ctx.clearRect(0,0, pads[id].cvs.width, pads[id].cvs.height); }

        function setRadioValue(name, value) {
            const radios = document.getElementsByName(name);
            for(let i=0; i<radios.length; i++) { if(radios[i].value === value) radios[i].checked = true; }
        }
        function getRadioValue(name) {
            const radios = document.getElementsByName(name);
            for(let i=0; i<radios.length; i++) { if(radios[i].checked) return radios[i].value; }
            return '';
        }

        const carMap = {
            "1호차": { type: "유니버스", num: "78무4922" },
            "2호차": { type: "유니버스", num: "78무4921" },
            "3호차": { type: "유니버스", num: "70부1557" },
            "11호차": { type: "쏠라티", num: "732무8319" },
            "12호차": { type: "쏠라티", num: "732무8320" },
            "13호차": { type: "쏠라티", num: "732무8375" },
            "14호차": { type: "쏠라티", num: "732무8376" }
        };

        function parseTimeParam(t) {
            if (!t) return '';
            if (t.includes(':')) return t; 
            let num = parseFloat(t);
            if (isNaN(num)) return '';
            let h = Math.floor(num);
            let m = Math.round((num - h) * 60);
            return String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0');
        }

        window.onload = async () => {
            initPad('driver1-sign-pad');
            initPad('driver2-sign-pad');
            initPad('cust-sign-pad');

            const urlParams = new URLSearchParams(window.location.search);
            const resId = urlParams.get('resId'); 
            const pDate = urlParams.get('date');
            
            if(!resId || !pDate) return;
            globalDocId = resId + "_" + pDate; 

            let tIn = parseTimeParam(urlParams.get('in'));
            let tOut = parseTimeParam(urlParams.get('out'));
            
            let passedCar = (urlParams.get('car') || '').trim();
            let finalCarType = carMap[passedCar] ? carMap[passedCar].type : '유니버스';
            let finalCarName = passedCar; 
            let finalCarNum = carMap[passedCar] ? carMap[passedCar].num : passedCar; 

            let driversRaw = (urlParams.get('driver') || '').split(',');
            let drivers = driversRaw.map(d => d.trim()).filter(d => d && d !== '황덕일');
            let d1 = drivers[0] || '';
            let d2 = drivers[1] || '';

            const reasonRaw = urlParams.get('reason') || '';
            const finalReason = reasonRaw.includes('공공') ? '공공예약' : '기타';

            let initialTrip = '당일';
            if(reasonRaw.includes('1박')) initialTrip = '1박2일';
            else if(reasonRaw.includes('2박')) initialTrip = '2박3일';

            try {
                const docSnap = await db.collection('reports').doc(globalDocId).get();
                
                if(docSnap.exists) {
                    const data = docSnap.data();
                    document.getElementById('m-date').value = data.date || pDate;
                    
                    document.getElementById('m-car-type').value = data.carType || finalCarType;
                    document.getElementById('m-car-name').value = data.carName || finalCarName; 
                    document.getElementById('m-car').value = data.car || finalCarNum;
                    document.getElementById('m-driver1').value = data.driver1 || d1;
                    document.getElementById('m-driver2').value = data.driver2 || d2;
                    
                    document.getElementById('m-time-start').value = data.t_start || tIn;
                    document.getElementById('m-time-end').value = data.t_end || tOut;
                    document.getElementById('m-km-start').value = data.k_start || '';
                    document.getElementById('m-km-end').value = data.k_end || '';
                    
                    document.getElementById('m-time-board').value = data.t_board || '';
                    document.getElementById('m-time-alight').value = data.t_alight || '';
                    document.getElementById('m-km-board').value = data.k_board || '';
                    document.getElementById('m-km-alight').value = data.k_alight || '';

                    setRadioValue('m-reason', data.reason || finalReason);
                    setRadioValue('m-trip', data.trip || initialTrip); 
                    
                    document.getElementById('m-trip-day').value = data.tripDay || '';
                    document.getElementById('m-loc-start').value = data.l_start || '';
                    document.getElementById('m-loc-end').value = data.l_end || urlParams.get('dest') || '';
                    document.getElementById('m-pax-w').value = data.p_w || '';
                    document.getElementById('m-pax-n').value = data.p_n || '';
                    
                    document.getElementById('m-pax-disabled').value = data.p_disabled || '';
                    document.getElementById('m-pax-non-disabled').value = data.p_non_disabled || '';
                    document.getElementById('m-note').value = data.note || '';

                    document.getElementById('m-cust-name').value = data.c_name || '';
                    
                    calcKm();

                    setTimeout(() => {
                        if (data.driver1Sign && data.driver1Sign.length > 1300) { const img = new Image(); img.onload = () => pads['driver1-sign-pad'].ctx.drawImage(img, 0, 0); img.src = data.driver1Sign; }
                        if (data.driver2Sign && data.driver2Sign.length > 1300) { const img = new Image(); img.onload = () => pads['driver2-sign-pad'].ctx.drawImage(img, 0, 0); img.src = data.driver2Sign; }
                        if (data.custSign && data.custSign.length > 1300) { const img = new Image(); img.onload = () => pads['cust-sign-pad'].ctx.drawImage(img, 0, 0); img.src = data.custSign; }
                    }, 100);
                } else {
                    document.getElementById('m-date').value = pDate;
                    document.getElementById('m-car-type').value = finalCarType;
                    document.getElementById('m-car-name').value = finalCarName; 
                    document.getElementById('m-car').value = finalCarNum;
                    document.getElementById('m-driver1').value = d1;
                    document.getElementById('m-driver2').value = d2;
                    document.getElementById('m-time-start').value = tIn;
                    document.getElementById('m-time-end').value = tOut;
                    setRadioValue('m-reason', finalReason);
                    setRadioValue('m-trip', initialTrip); 
                    document.getElementById('m-loc-end').value = urlParams.get('dest') || '';
                }
            } catch(e) { console.error("DB Load Error", e); }
            
            setTimeout(() => { saveDraft(true); }, 500);
        };

        async function saveDraft(isSilent = false) {
            if(!globalDocId) return;
            try {
                const reportData = {
                    date: document.getElementById('m-date').value,
                    carType: document.getElementById('m-car-type').value,
                    carName: document.getElementById('m-car-name').value, 
                    car: document.getElementById('m-car').value,
                    driver1: document.getElementById('m-driver1').value,
                    driver2: document.getElementById('m-driver2').value,
                    trip: getRadioValue('m-trip'),
                    tripDay: document.getElementById('m-trip-day').value,
                    reason: getRadioValue('m-reason'),
                    t_start: document.getElementById('m-time-start').value,
                    t_end: document.getElementById('m-time-end').value,
                    k_start: document.getElementById('m-km-start').value,
                    k_end: document.getElementById('m-km-end').value,
                    t_board: document.getElementById('m-time-board').value, 
                    t_alight: document.getElementById('m-time-alight').value, 
                    k_board: document.getElementById('m-km-board').value, 
                    k_alight: document.getElementById('m-km-alight').value, 
                    l_start: document.getElementById('m-loc-start').value,
                    l_end: document.getElementById('m-loc-end').value,
                    p_w: document.getElementById('m-pax-w').value,
                    p_n: document.getElementById('m-pax-n').value,
                    p_disabled: document.getElementById('m-pax-disabled').value, 
                    p_non_disabled: document.getElementById('m-pax-non-disabled').value, 
                    note: document.getElementById('m-note').value, 
                    c_name: document.getElementById('m-cust-name').value,
                    driver1Sign: pads['driver1-sign-pad'].cvs.toDataURL('image/png'),
                    driver2Sign: pads['driver2-sign-pad'].cvs.toDataURL('image/png'),
                    custSign: pads['cust-sign-pad'].cvs.toDataURL('image/png')
                };
                
                await db.collection('reports').doc(globalDocId).set(reportData);
                if(!isSilent) alert('☁️ 파이어베이스 클라우드에 완벽하게 저장되었습니다!');
            } catch(e) { if(!isSilent) alert('저장 중 오류 발생: ' + e.message); }
        }

        async function clearDraft() {
            if(!globalDocId) return;
            if(confirm('서버에 저장된 이 배차의 일보를 완전히 삭제하시겠습니까?')) {
                await db.collection('reports').doc(globalDocId).delete();
                window.location.reload();
            }
        }

        function calcKm() {
            let s = parseFloat(document.getElementById('m-km-start').value) || 0;
            let e = parseFloat(document.getElementById('m-km-end').value) || 0;
            let total1 = Math.max(0, e - s);
            document.getElementById('m-km-total').innerText = total1.toLocaleString(); 

            let bs = parseFloat(document.getElementById('m-km-board').value) || 0;
            let be = parseFloat(document.getElementById('m-km-alight').value) || 0;
            let total2 = Math.max(0, be - bs);
            document.getElementById('m-km-board-total').innerText = total2.toLocaleString(); 
        }

        function calcTimeDiff(start, end) {
            if(!start || !end) return '';
            let sParts = start.split(':');
            let eParts = end.split(':');
            let diffMins = (parseInt(eParts[0]) * 60 + parseInt(eParts[1])) - (parseInt(sParts[0]) * 60 + parseInt(sParts[1]));
            if(diffMins < 0) diffMins += 24 * 60; 
            let h = Math.floor(diffMins / 60);
            let m = diffMins % 60;
            return String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0');
        }

        function doPrint() {
            saveDraft(true); 

            // 🔥 공공일보로 완벽 고정 (시티일보 로직 완전 삭제)
            document.getElementById('print-view').className = 'type-general';
            document.getElementById('print-bg').src = '공공일보.png';

            const dStr = document.getElementById('m-date').value;
            if(dStr) {
                const d = new Date(dStr);
                const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
                document.getElementById('pt-year').innerText = d.getFullYear();
                document.getElementById('pt-month').innerText = String(d.getMonth()+1).padStart(2,'0');
                document.getElementById('pt-day').innerText = String(d.getDate()).padStart(2,'0');
                document.getElementById('pt-weekday').innerText = weekdays[d.getDay()]; 
            }

            const trip = getRadioValue('m-trip');
            const tripDay = document.getElementById('m-trip-day').value;

            for(let i=1; i<=3; i++) document.getElementById('pt-chk-trip-'+i).style.display = 'none';
            document.getElementById('pt-trip-night').style.display = 'none';
            document.getElementById('pt-trip-days').style.display = 'none';
            document.getElementById('pt-trip-day-num').style.display = 'none';

            if(trip === '당일') {
                document.getElementById('pt-chk-trip-1').style.display = 'block';
            } else if(trip === '1박2일') {
                document.getElementById('pt-chk-trip-2').style.display = 'block';
                document.getElementById('pt-trip-night').innerText = '1';
                document.getElementById('pt-trip-night').style.display = 'block';
                document.getElementById('pt-trip-days').innerText = '2';
                document.getElementById('pt-trip-days').style.display = 'block';
            } else if(trip === '2박3일') {
                document.getElementById('pt-chk-trip-3').style.display = 'block';
                document.getElementById('pt-trip-night').innerText = '2';
                document.getElementById('pt-trip-night').style.display = 'block';
                document.getElementById('pt-trip-days').innerText = '3';
                document.getElementById('pt-trip-days').style.display = 'block';
            }
            
            if (trip !== '당일' && tripDay) {
                document.getElementById('pt-trip-day-num').innerText = tripDay;
                document.getElementById('pt-trip-day-num').style.display = 'block';
            }

            const reason = getRadioValue('m-reason');
            for(let i=1; i<=5; i++) document.getElementById('pt-chk-'+i).style.display = 'none';
            if(reason === '공공예약') document.getElementById('pt-chk-1').style.display = 'block';
            if(reason === '이동지원') document.getElementById('pt-chk-2').style.display = 'block';
            if(reason === '검사') document.getElementById('pt-chk-3').style.display = 'block';
            if(reason === '수리') document.getElementById('pt-chk-4').style.display = 'block';
            if(reason === '기타') document.getElementById('pt-chk-5').style.display = 'block';

            document.getElementById('pt-car-type').innerText = document.getElementById('m-car-type').value || '';
            document.getElementById('pt-car-name').innerText = document.getElementById('m-car-name').value || ''; 
            document.getElementById('pt-car').innerText = document.getElementById('m-car').value || '';
            
            document.getElementById('pt-driver1').innerText = document.getElementById('m-driver1').value || '';
            document.getElementById('pt-driver2').innerText = document.getElementById('m-driver2').value || '';
            
            let ts = document.getElementById('m-time-start').value;
            let te = document.getElementById('m-time-end').value;
            let tbs = document.getElementById('m-time-board').value;
            let tba = document.getElementById('m-time-alight').value;

            document.getElementById('pt-time-start').innerText = ts || '';
            document.getElementById('pt-time-end').innerText = te || '';
            document.getElementById('pt-time-total').innerText = calcTimeDiff(ts, te);

            document.getElementById('pt-time-board').innerText = tbs || '';
            document.getElementById('pt-time-alight').innerText = tba || '';
            document.getElementById('pt-time-board-total').innerText = calcTimeDiff(tbs, tba);

            let ks = document.getElementById('m-km-start').value;
            let ke = document.getElementById('m-km-end').value;
            let kbs = document.getElementById('m-km-board').value;
            let kba = document.getElementById('m-km-alight').value;

            document.getElementById('pt-km-start').innerText = ks ? Number(ks).toLocaleString() : '';
            document.getElementById('pt-km-end').innerText = ke ? Number(ke).toLocaleString() : '';
            document.getElementById('pt-km-total').innerText = document.getElementById('m-km-total').innerText || '';
            
            document.getElementById('pt-km-board').innerText = kbs ? Number(kbs).toLocaleString() : '';
            document.getElementById('pt-km-alight').innerText = kba ? Number(kba).toLocaleString() : '';
            document.getElementById('pt-km-board-total').innerText = document.getElementById('m-km-board-total').innerText || '';

            document.getElementById('pt-loc-start').innerText = document.getElementById('m-loc-start').value || '';
            document.getElementById('pt-loc-end').innerText = document.getElementById('m-loc-end').value || '';
            document.getElementById('pt-pax-w').innerText = document.getElementById('m-pax-w').value || '';
            document.getElementById('pt-pax-n').innerText = document.getElementById('m-pax-n').value || '';
            
            document.getElementById('pt-pax-disabled').innerText = document.getElementById('m-pax-disabled').value || '';
            document.getElementById('pt-pax-non-disabled').innerText = document.getElementById('m-pax-non-disabled').value || '';
            document.getElementById('pt-note').innerText = document.getElementById('m-note').value || '';

            document.getElementById('pt-cust-name').innerText = document.getElementById('m-cust-name').value || '';

            const d1Sign = pads['driver1-sign-pad'].cvs.toDataURL('image/png');
            const d2Sign = pads['driver2-sign-pad'].cvs.toDataURL('image/png');
            const cSign = pads['cust-sign-pad'].cvs.toDataURL('image/png');
            
            const ptD1 = document.getElementById('pt-driver1-sign');
            if(d1Sign.length > 1300) { ptD1.src = d1Sign; ptD1.style.display = 'block'; } else { ptD1.style.display = 'none'; }

            const ptD2 = document.getElementById('pt-driver2-sign');
            if(d2Sign.length > 1300) { ptD2.src = d2Sign; ptD2.style.display = 'block'; } else { ptD2.style.display = 'none'; }

            const ptCust = document.getElementById('pt-cust-sign');
            const ptCust2 = document.getElementById('pt-cust-sign2');
            if(cSign.length > 1300) { 
                ptCust.src = cSign; ptCust.style.display = 'block'; 
                ptCust2.src = cSign; ptCust2.style.display = 'block'; 
            } else { 
                ptCust.style.display = 'none'; 
                ptCust2.style.display = 'none'; 
            }

            // 🔥 스마트폰 먹통 방지: 즉시 인쇄 실행
            window.print();
        }
    </script>
</body>
